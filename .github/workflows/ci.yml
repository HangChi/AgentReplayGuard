name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --extra dev --extra langgraph
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src/agentreplayguard
      - name: Test & coverage
        # 本包是 pytest 插件，会在 pytest-cov 启动前被导入，故用
        # `coverage run -m pytest` 而非 `pytest --cov` 来测量源码覆盖率。
        run: uv run coverage run -m pytest tests examples/refund && uv run coverage report --fail-under=90

  offline:
    name: offline determinism check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev --extra langgraph
      - name: Test with network blocked
        # 阻断外部网络，验证无真实外部请求；依赖安装已在上一步完成。
        run: |
          sudo ip link set lo down || true
          uv run pytest tests/integration/test_determinism_and_offline.py -q
