name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --extra dev --extra langgraph
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src/agentreplayguard
      - name: Test & coverage
        # 本包是 pytest 插件，会在 pytest-cov 启动前被导入，故用
        # `coverage run -m pytest` 而非 `pytest --cov` 来测量源码覆盖率。
        run: uv run coverage run -m pytest tests examples/refund && uv run coverage report --fail-under=90

  offline:
    name: offline determinism check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev --extra langgraph
      - name: Test with network blocked
        # 用不可达代理阻断外部请求，但保留 loopback：关闭 lo 会让 GitHub Actions
        # runner 无法回传任务结果，导致 job 永久停在 in_progress。
        # 依赖安装已在上一步完成，测试内部另有 socket 级断网断言。
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          all_proxy: http://127.0.0.1:9
          NO_PROXY: ""
        run: uv run pytest tests/integration/test_determinism_and_offline.py -q
