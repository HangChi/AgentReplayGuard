[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentreplayguard"
version = "0.6.0"
description = "Deterministic side-effect safety testing for LangGraph agents: fault injection and effect-ledger assertions to catch duplicate business operations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentReplayGuard contributors" }]
keywords = ["langgraph", "agent", "testing", "fault-injection", "idempotency", "pytest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/agentreplayguard/agentreplayguard"
Documentation = "https://github.com/agentreplayguard/agentreplayguard#readme"
Repository = "https://github.com/agentreplayguard/agentreplayguard"

[project.optional-dependencies]
# 核心包仅标准库；langgraph / httpx / requests 是可选适配层依赖
langgraph = ["langgraph>=1.2,<2.0"]
httpx = ["httpx>=0.27,<1.0"]
requests = ["requests>=2.28,<3.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "langgraph>=1.2,<2.0",
    "httpx>=0.27,<1.0",
    "requests>=2.28,<3.0",
]

[project.entry-points.pytest11]
agentreplayguard = "agentreplayguard.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/agentreplayguard"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: integration tests requiring the langgraph optional dependency",
]

[tool.coverage.run]
# 本包同时是 pytest 插件（pytest11 entry point），会在 pytest-cov 启动前被导入，
# 因此用 `coverage run -m pytest` 而非 `pytest --cov` 来测量源码覆盖率。
source = ["agentreplayguard"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["agentreplayguard"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["agentreplayguard"]
mypy_path = "src"
exclude = ["tests", "examples"]

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true
